server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Matches the API's JSON body limit (10mb); nginx's default of 1m would reject larger uploads first.
    client_max_body_size 10m;

    # The TRIVO operator (platform) API — registering / suspending companies — is NEVER exposed to the internet.
    # Call it from the server itself, on the API's loopback port (127.0.0.1:3001). See DEPLOY.md.
    location /api/v1/platform {
        return 404;
    }

    location /api/ {
        proxy_pass http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://server:3001/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
