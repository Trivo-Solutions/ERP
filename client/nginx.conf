# Access log without customer-search terms or invitation tokens. The existing-customer search and the estimates search put
# a customer's name / mobile number in the query string (GET /api/v1/estimation/customers?q=..., /api/v1/sales/estimates?q=...)
# and an invitation link carries a one-time token (/accept-invitation?token=...); the default format records the whole
# request line AND the Referer (the page URL, which on the invitation page contains the token).
# Search endpoints: two matches, either redacts - the RAW request URI (case-insensitive, trailing/repeated slashes), needed
# because try_files rewrites $uri to /index.html before logging when a mis-cased path falls through to the SPA, and nginx's
# NORMALIZED $uri (percent-escapes decoded). Anchored, so /customersX or /estimates/123/pdf are not matched.
# Token: any request whose query string has a token= parameter (the SPA serves every path, so match the parameter, not the path).
# These directives sit at http level (this file is included inside http {}); the access_log is set in the server below.
map $request_uri $trivo_search_raw_uri {
    default                                                                  "";
    "~*^/+api/+v1/+(estimation/+customers|sales/+estimates)/*(\?|$)"        "/api/v1/$1?[redacted]";
}
map $uri $trivo_search_norm_uri {
    default                                                                  "";
    "~*^/+api/+v1/+(estimation/+customers|sales/+estimates)/*$"             "$uri?[redacted]";
}
map $request_uri $trivo_token_uri {
    default                                                                  "";
    "~*^([^?]*)\?(.*&)?token="                                               "$1?[redacted]";
}
map $trivo_search_raw_uri $trivo_u1 {
    ""                                                                       $trivo_search_norm_uri;
    default                                                                  $trivo_search_raw_uri;
}
map $trivo_u1 $trivo_u2 {
    ""                                                                       $trivo_token_uri;
    default                                                                  $trivo_u1;
}
map $trivo_u2 $trivo_log_request_uri {
    ""                                                                       $request_uri;
    default                                                                  $trivo_u2;
}
map $http_referer $trivo_log_referer {
    ""                                                                       "-";
    default                                                                  $http_referer;
    "~*^([^?]*)\?(.*&)?token="                                               "$1?[redacted]";
}
log_format trivo_redacted '$remote_addr - $remote_user [$time_local] "$request_method $trivo_log_request_uri $server_protocol" '
                          '$status $body_bytes_sent "$trivo_log_referer" "$http_user_agent" "$http_x_forwarded_for" rt=$request_time';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log trivo_redacted;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Matches the API's JSON body limit (10mb); nginx's default of 1m would reject larger uploads first.
    client_max_body_size 10m;

    # The TRIVO operator (platform) API — registering / suspending companies — is NEVER exposed to the internet.
    # Call it from the server itself, on the API's loopback port (127.0.0.1:3001). See DEPLOY.md.
    location /api/v1/platform {
        return 404;
    }

    location /api/ {
        proxy_pass http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://server:3001/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
