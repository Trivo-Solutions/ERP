version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sea_erp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sea_erp
      POSTGRES_PASSWORD: sea_erp_pass
      POSTGRES_DB: sea_erp_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sea_erp -d sea_erp_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sea_erp_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  minio:
    # minio/minio was removed from Docker Hub and quay.io no longer serves it; Chainguard builds MinIO from source.
    # The image is distroless (no curl), so the old curl healthcheck cannot run - probe /minio/health/live from outside.
    image: cgr.dev/chainguard/minio:latest
    container_name: sea_erp_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  postgres_data:
  redis_data:
  minio_data:
